name: Deploy ammonia dispatch demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public demo site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/media
          cp index.html _site/index.html
          cp assets/app.js _site/assets/app.js
          cp assets/styles.css _site/assets/styles.css
          cp assets/process-map.svg _site/assets/process-map.svg
          cp assets/digital-shift-dispatcher.webp _site/assets/digital-shift-dispatcher.webp
          cp docs/assets/yuntu-ammonia-final-demo.webm _site/media/yuntu-ammonia-final-demo.webm
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
